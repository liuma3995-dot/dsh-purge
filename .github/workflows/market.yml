name: Publish plugin market
on:
  workflow_run:
    workflows: ['Community release']
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'liuma3995-dot/dsh-purge' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix market ci --ignore-scripts --legacy-peer-deps
      - run: node scripts/build-market.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - run: node market/validate.mjs market-dist/index.json
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-market-index
          path: market-dist
      - name: Explain private-repository Pages
        if: github.event.repository.visibility != 'public'
        run: echo "::notice::GitHub Pages is unavailable for this private repository. The validated market index is attached as a workflow artifact."
      - uses: actions/configure-pages@v5
        if: github.event.repository.visibility == 'public'
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        if: github.event.repository.visibility == 'public'
        with:
          path: market-dist
      - name: Deploy index
        id: deployment
        if: github.event.repository.visibility == 'public'
        uses: actions/deploy-pages@v4
